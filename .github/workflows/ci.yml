name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22
          - os: ubuntu-24.04
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      # The Ubuntu runner already includes Chromium's system libraries.
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
